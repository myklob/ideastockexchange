name: Add to a page
description: Add a row to any table on a page (a reason, a finding, a prediction, a criterion, a cost or benefit, an interest, an assumption, a work, a law, a definition and so on) or a cell on a topic page. What happens next, in one sentence, is that a check runs for duplicates and then either counts this as your vote for the claim already on the site (and files it here too, if it is not here yet) or opens a pull request that adds your rows for the maintainer to merge.
title: "Reason to agree: "
labels: [contribution]
body:
  - type: markdown
    attributes:
      value: |
        One complete sentence that could headline a page of its own. A vote never moves a score; a claim does, once it is argued.
  - type: input
    id: page
    attributes:
      label: Page
      description: The key of the page this belongs on (the last part of its address, before .html). For a cell on a topic page, the topic's key.
      placeholder: barring-members-congress-president
    validations:
      required: true
  - type: dropdown
    id: section
    attributes:
      label: Section
      description: Which table on the page the row goes in. A cost or benefit is cba; agree means a benefit and disagree means a cost. The last ten are the cells of a topic page.
      options:
        - argument
        - evidence
        - falsify
        - prediction
        - criterion
        - cba
        - short_term
        - long_term
        - component
        - assumption
        - interest
        - value
        - shared_interest
        - compromise
        - motive
        - dispute
        - obstacle
        - bias
        - media
        - law
        - upstream
        - downstream
        - similar
        - definition
        - person
        - impact
        - interest_listing
        - direction
        - strength
        - rung
        - stack
        - topic_values
        - engagement
        - common
        - criteria
        - related
    validations:
      required: true
  - type: dropdown
    id: side
    attributes:
      label: Side
      description: Does it count for the page's claim (agree) or against it (disagree)? A table with no sides ignores this; pick either. For similar, agree means more extreme and disagree means more moderate.
      options:
        - agree
        - disagree
    validations:
      required: true
  - type: textarea
    id: text
    attributes:
      label: The claim
      description: One complete sentence, atomic, that is true or false on its own. For a value or a definition, the value or the meaning.
      placeholder: Postal infrastructure already reaches every zip code.
    validations:
      required: true
  - type: input
    id: category
    attributes:
      label: Category
      description: Optional, for a cell on a topic page only. direction is -100, -50, 0, +50 or +100; strength is Modest, Moderate, Strong or Total; rung is general, a branch letter like A or a leaf like A.1; stack is oppose, mixed or support; engagement is 1 to 4; common is shared, conflict or compromise; related is child, sibling or opposing.
  - type: input
    id: source
    attributes:
      label: Source
      description: Optional. Where it can be checked, as title, producer and year. For a prediction, when and how it gets settled. For a definition, the term being defined (required). For a motive, what the record suggests the actual reason is.
  - type: input
    id: url
    attributes:
      label: URL
      description: Optional. The address where the source can be read. It is kept on the row as its own field, and the page links it.
  - type: input
    id: date
    attributes:
      label: Date checked
      description: Optional. The day you checked the source, as YYYY-MM-DD. It is kept on the row as its own field.
  - type: input
    id: magnitude
    attributes:
      label: Estimate
      description: Optional, for a cost or benefit only. Your best single number, written positive; the side says whether it is a cost or a benefit.
  - type: input
    id: mag_low
    attributes:
      label: Low end
      description: Optional, for a cost or benefit only. The low end of the estimate, in the same units.
  - type: input
    id: mag_high
    attributes:
      label: High end
      description: Optional, for a cost or benefit only. The high end of the estimate, in the same units.
  - type: input
    id: units
    attributes:
      label: Units
      description: Optional, for a cost or benefit only. What the numbers count, such as dollars per year, cases or hours.
  - type: input
    id: who
    attributes:
      label: Who gains or pays
      description: Optional, for a cost or benefit only. The interest that gains or pays, in its own words or by its page key.
  - type: textarea
    id: why
    attributes:
      label: Why it bears on the page
      description: Optional. One or two sentences on why this belongs on that page.
