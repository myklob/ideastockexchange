name: Check a pull request

# A reader's contribution arrives as a pull request opened by the intake workflow, and the owner's rule is to
# merge it when its checks pass. This is the check: the same gates the publish workflow runs before it will
# deploy, run on the pull request so the result shows on it before anything is merged. It deploys nothing.
on:
  pull_request:
    paths:
      - 'tools/static-site/**'
      - 'templates/**'
      - 'tools/check_templates.py'
      - '.github/workflows/check.yml'

permissions:
  contents: read

concurrency:
  group: check-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: pip install -r tools/static-site/requirements.txt
      - name: Check the workbook and the reviewable CSVs are in step
        run: python3 tools/static-site/sync_content.py --check
      - name: Refuse a circular argument
        run: python3 tools/static-site/integrity.py tools/static-site/content
      - name: Run the test suite
        run: python3 -m unittest discover -s tools/static-site -p 'test_*.py'
      - name: Check the page templates are the current ones
        run: python3 tools/check_templates.py
      - name: Check the contract numbers
        run: python3 tools/static-site/conformance.py --check
      - name: Render the site and refuse a broken link
        run: |
          python3 tools/static-site/render_site.py tools/static-site/ISE_Data_Entry.xlsx _site/beliefs | tee render.log
          grep -q 'broken internal links: 0' render.log
